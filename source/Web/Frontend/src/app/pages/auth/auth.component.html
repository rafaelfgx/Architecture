<div class="uk-flex uk-flex-center uk-child-width-1-1 uk-child-width-1-2@s uk-child-width-1-2@m uk-child-width-1-3@l">
    <form [formRoot]="form">
        <fieldset class="uk-fieldset">
            <div class="uk-margin">
                <app-label for="login" text="Login" />
                <app-input-text id="login" [formField]="form.login" text="Login" [autofocus]="true" />
            </div>
            <div class="uk-margin">
                <app-label for="password" text="Password" />
                <app-input-password id="password" [formField]="form.password" text="Password" />
            </div>
            <div class="uk-margin uk-text-center">
                <app-button id="signin" text="Sign in" [disabled]="form().invalid() || form().submitting()" type="submit" />
            </div>
        </fieldset>
    </form>
</div>
